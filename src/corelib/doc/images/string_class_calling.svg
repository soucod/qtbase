<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="-410 -30 540 540"><style>svg path.node{fill:inherit;stroke:inherit}svg .node-style{fill:#56e59d;stroke:#333}svg #arrow-tip,svg #footnotes{fill:#333}svg .arrow-style{stroke:#333}svg .text-style,svg .text-style-arrows{font:12px arial;fill:#333}svg .small-style{font:8px arial;fill:#333}[data-theme=dark] svg .node-style{fill:#1a8550;stroke:#f2f2f2}[data-theme=dark] svg #arrow-tip,[data-theme=dark] svg #footnotes{fill:#f2f2f2}[data-theme=dark] svg .arrow-style{stroke:#f2f2f2}[data-theme=dark] svg .text-style,[data-theme=dark] svg .text-style-arrows{font:12px arial;fill:#f2f2f2}[data-theme=dark] svg .small-style{font:8px arial;fill:#f2f2f2}[data-theme=light] svg .node-style{fill:#56e59d;stroke:#333}[data-theme=light] svg #arrow-tip,[data-theme=light] svg #footnotes{fill:#333}[data-theme=light] svg .arrow-style{stroke:#333}[data-theme=light] svg .text-style,[data-theme=light] svg .text-style-arrows{font:12px arial;fill:#333}[data-theme=light] svg .small-style{font:8px arial;fill:#333}</style><defs><path id="raute" stroke-width="1" d="m 0 -40 L 80 0 L 0 40 L -80 0 z" class="node"/><path id="lozenge" stroke-width="1" d="M -60,-20 h 120 a 20,20 0 0 1 20,20 v 0 a 20,20 0 0 1 -20,20 h -120 a 20,20 0 0 1 -20,-20 v 0 a 20,20 0 0 1 20,-20 Z" class="node"/><path id="lozenge_small" stroke-width="1" d="M -40,-20 h 80 a 20,20 0 0 1 20,20 v 0 a 20,20 0 0 1 -20,20 h -80 a 20,20 0 0 1 -20,-20 v 0 a 20,20 0 0 1 20,-20 Z" class="node"/><marker id="triangle" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="1" refY="5" viewBox="0 0 10 10"><path id="arrow-tip" fill="#333" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><g id="start" transform="translate(-160, 0)"><use fill="#56E59D" stroke="#333" class="node-style" href="#lozenge"/><text x="0" y="-3" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">Choosing a string class</text><text x="0" y="11" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">for calling Qt functions</text></g><g id="param_or_return" transform="translate(-160, 100)"><use fill="#56E59D" stroke="#333" class="node-style" href="#raute"/><text x="0" y="-10" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">Is your string</text><text x="0" y="4" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">known at compile time</text><text x="0" y="18" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">(a literal)?</text></g><g id="ref_or_perm" transform="translate(-320, 200)"><use fill="#56E59D" stroke="#333" class="node-style" href="#raute"/><text x="0" y="-5" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">Is the parameter a</text><text x="0" y="9" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">QString or a Q*View?</text></g><g id="ref_or_perm" transform="translate(-320, 330)"><use fill="#56E59D" stroke="#333" class="node-style" href="#raute"/><text x="0" y="-3" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">Has the parameter a</text><text x="0" y="11" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">preferred² encoding?</text></g><g id="make_copy" transform="translate(-100, 330)"><use fill="#56E59D" stroke="#333" class="node-style" href="#raute"/><text x="0" y="-3" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">Is your string</text><text x="0" y="11" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">ASCII?</text></g><g transform="translate(40, 150)"><use fill="#56E59D" stroke="#333" class="node-style" href="#lozenge"/><text x="0" y="-3" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">QString¹</text><text x="0" y="11" fill="#333" class="small-style" font-family="Arial" font-size="8" text-anchor="middle">or any other owning string</text></g><g transform="translate(-100, 200)"><use fill="#56E59D" stroke="#333" class="node-style" href="#lozenge"/><text x="0" y="-3" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">QStringLiteral</text><text x="0" y="11" fill="#333" class="small-style" font-family="Arial" font-size="8" text-anchor="middle">same as u&quot;foo&quot;_s</text></g><g transform="translate(40, 390)"><use fill="#56E59D" stroke="#333" class="node-style" href="#lozenge"/><text x="0" y="-3" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">QLatin1StringView</text><text x="0" y="11" fill="#333" class="small-style" font-family="Arial" font-size="8" text-anchor="middle">create with &quot;foo&quot;_L1</text></g><g transform="translate(-100, 430)"><use fill="#56E59D" stroke="#333" class="node-style" href="#lozenge"/><text x="0" y="-3" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">QStringView</text><text x="0" y="11" fill="#333" class="small-style" font-family="Arial" font-size="8" text-anchor="middle">create with u&quot;foo&quot;</text></g><g transform="translate(-320, 430)"><use fill="#56E59D" stroke="#333" class="node-style" href="#lozenge"/><text x="0" y="-6" fill="#333" class="text-style" font-family="Arial" font-size="12" text-anchor="middle">Q*StringView</text><text x="0" y="5" fill="#333" class="small-style" font-family="Arial" font-size="8" text-anchor="middle">of the preferred encoding,</text><text x="0" y="15" fill="#333" class="small-style" font-family="Arial" font-size="8" text-anchor="middle">create with u&quot;foo&quot;, u8&quot;foo&quot; or &quot;foo&quot;_L1</text></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l 0 30" class="arrow-style" transform="translate(-160, 20)"/></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l -80 0 l 0 50" class="arrow-style" transform="translate(-240, 100)"/><text x="-40" y="-5" fill="#333" class="text-style-arrows" dominant-baseline="auto" font-family="Arial" font-size="12" text-anchor="middle" transform="translate(-240, 100)">yes</text></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l 120 0 l 0 20" class="arrow-style" transform="translate(-80, 100)"/><text x="60" y="-5" fill="#333" class="text-style-arrows" dominant-baseline="auto" font-family="Arial" font-size="12" text-anchor="middle" transform="translate(-80, 100)">no</text></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l 50 0" class="arrow-style" transform="translate(-240, 200)"/><text x="25" y="-5" fill="#333" class="text-style-arrows" dominant-baseline="auto" font-family="Arial" font-size="12" text-anchor="middle" transform="translate(-240, 200)">QString</text></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l 0 40" class="arrow-style" transform="translate(-320, 240)"/><text x="5" y="20" fill="#333" class="text-style-arrows" dominant-baseline="middle" font-family="Arial" font-size="12" text-anchor="left" transform="translate(-320, 240)">Q*View</text></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l 50 0" class="arrow-style" transform="translate(-240, 330)"/><text x="30" y="-5" fill="#333" class="text-style-arrows" dominant-baseline="auto" font-family="Arial" font-size="12" text-anchor="middle" transform="translate(-240, 330)">no</text></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l 0 30" class="arrow-style" transform="translate(-320, 370)"/><text x="5" y="15" fill="#333" class="text-style-arrows" dominant-baseline="middle" font-family="Arial" font-size="12" text-anchor="left" transform="translate(-320, 370)">yes</text></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l 60 0 l 0 30" class="arrow-style" transform="translate(-20, 330)"/><text x="30" y="-5" fill="#333" class="text-style-arrows" dominant-baseline="auto" font-family="Arial" font-size="12" text-anchor="middle" transform="translate(-20, 330)">yes</text></g><g><path fill="none" stroke="#333" marker-end="url(#triangle)" d="M 0 0 l 0 30" class="arrow-style" transform="translate(-100, 370)"/><text x="5" y="15" fill="#333" class="text-style-arrows" dominant-baseline="middle" font-family="Arial" font-size="12" text-anchor="left" transform="translate(-100, 370)">no</text></g><g transform="translate(-405, 465)"><text id="footnotes" x="5" y="5" fill="#333" font-family="Arial" font-size="9" text-anchor="left">1:</text><text id="footnotes" x="15" y="5" fill="#333" font-family="Arial" font-size="9" text-anchor="left">An owning string is required to assemble or store a string at runtime, if it is not known at compile time. This can be QString or any</text><text id="footnotes" x="15" y="15" fill="#333" font-family="Arial" font-size="9" text-anchor="left">other owning string, such as std::string. The correct choice depends on the required encoding.</text><text id="footnotes" x="5" y="29" fill="#333" font-family="Arial" font-size="9" text-anchor="left">2:</text><text id="footnotes" x="15" y="29" fill="#333" font-family="Arial" font-size="9" text-anchor="left">Some functions are more effective when using the preferred encoding. For example, QUtf8StringView::compare is fastest with</text><text id="footnotes" x="15" y="39" fill="#333" font-family="Arial" font-size="9" text-anchor="left">QUtf8StringView. If you are unsure, proceed as if there were no preferred encoding.</text></g></svg>